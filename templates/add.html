<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>武器情報追加 | GAME WIKI</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <!-- =========================
         ページ上部
    ========================== -->
    <header class="site-header">

        <div class="header-container">

            <a href="/" class="site-title">
                GAME WIKI
            </a>

            <nav class="site-nav" aria-label="メインナビゲーション">
                <a href="/">トップ</a>
                <a href="/favorites">武器一覧</a>
                <a href="/search">検索</a>
            </nav>

        </div>

    </header>


    <!-- =========================
         メインコンテンツ
    ========================== -->
    <main class="main-container">

        <section class="form-section">

            <div class="section-heading">
                <div>
                    <h1>武器情報追加</h1>

                    <p>
                        武器名、武器種、攻撃属性、入手場所、特徴を登録します。
                    </p>
                </div>
            </div>


            <form class="favorite-form" action="/add" method="POST">

                <div class="form-group">
                    <label for="title">武器名</label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="例：クレイモア"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="weapon_type">武器種</label>

                    <input
                        type="text"
                        id="weapon_type"
                        name="weapon_type"
                        placeholder="例：大剣"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="attack_type">攻撃属性</label>

                    <input
                        type="text"
                        id="attack_type"
                        name="attack_type"
                        placeholder="例：標準 / 刺突"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="location">入手場所</label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="例：モーンの城"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="memo">特徴メモ</label>

                    <textarea
                        id="memo"
                        name="memo"
                        placeholder="例：強攻撃が刺突。筋力・技量補正。戦灰の付け替えが可能。"
                        rows="6"
                    ></textarea>
                </div>


                <div class="form-actions">
                    <button type="submit" class="btn">
                        追加する
                    </button>

                    <a href="/favorites" class="btn secondary-btn">
                        キャンセル
                    </a>
                </div>

            </form>

        </section>

    </main>


    <footer class="site-footer">
        <p>GAME WIKI</p>
    </footer>

</body>

</html>
