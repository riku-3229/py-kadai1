<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>攻略情報追加 | GAME WIKI</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <!-- =========================
         ページ上部
    ========================== -->
    <header class="site-header">

        <div class="header-container">

            <a href="/" class="site-title">
                GAME WIKI
            </a>

            <nav class="site-nav" aria-label="メインナビゲーション">
                <a href="/">トップ</a>
                <a href="/favorites">攻略一覧</a>
                <a href="/search">検索</a>
            </nav>

        </div>

    </header>


    <!-- =========================
         メインコンテンツ
    ========================== -->
    <main class="main-container">

        <section class="form-section">

            <div class="section-heading">
                <div>
                    <h1>攻略情報追加</h1>

                    <p>
                        ゲーム内で見つけた敵、武器、アイテムなどの情報を登録します。
                    </p>
                </div>
            </div>


            <form class="favorite-form" action="/add" method="POST">

                <div class="form-group">
                    <label for="game">ゲーム名</label>

                    <input
                        type="text"
                        id="game"
                        name="game"
                        placeholder="例：ELDEN RING"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="title">名前</label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="例：火の巨人"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="genre">カテゴリ</label>

                    <select id="genre" name="genre" required>
                        <option value="">カテゴリを選択してください</option>
                        {{ genre_options }}
                    </select>
                </div>


                <div class="form-group">
                    <label for="memo">攻略メモ</label>

                    <textarea
                        id="memo"
                        name="memo"
                        placeholder="例：第2形態では正面から攻撃を見た方が回避しやすい。"
                        rows="6"
                    ></textarea>
                </div>


                <div class="form-group">
                    <label for="image">画像パス</label>

                    <input
                        type="text"
                        id="image"
                        name="image"
                        placeholder="例：/static/images/fire_giant.jpg"
                    >

                    <p class="form-help">
                        画像を使う場合は static/images フォルダに画像を置き、
                        そのパスを入力します。
                    </p>
                </div>


                <div class="form-actions">
                    <button type="submit" class="btn">
                        追加する
                    </button>

                    <a href="/favorites" class="btn secondary-btn">
                        キャンセル
                    </a>
                </div>

            </form>

        </section>

    </main>


    <footer class="site-footer">
        <p>GAME WIKI</p>
    </footer>

</body>

</html>
