<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>攻略情報削除 | GAME WIKI</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <!-- =========================
         ページ上部
    ========================== -->
    <header class="site-header">

        <div class="header-container">

            <a href="/" class="site-title">
                GAME WIKI
            </a>

            <nav class="site-nav" aria-label="メインナビゲーション">
                <a href="/">トップ</a>
                <a href="/favorites">攻略一覧</a>
                <a href="/search">検索</a>
            </nav>

        </div>

    </header>


    <!-- =========================
         メインコンテンツ
    ========================== -->
    <main class="main-container">

        <section class="form-section">

            <div class="section-heading">

                <div>
                    <h1>攻略情報削除</h1>

                    <p>
                        次の攻略情報を削除します。内容を確認してください。
                    </p>
                </div>

            </div>


            <div class="delete-confirmation">

                <dl>

                    <div>
                        <dt>ゲーム名</dt>
                        <dd>{{ wiki_game }}</dd>
                    </div>

                    <div>
                        <dt>名前</dt>
                        <dd>{{ wiki_title }}</dd>
                    </div>

                    <div>
                        <dt>カテゴリ</dt>
                        <dd>{{ wiki_genre }}</dd>
                    </div>

                </dl>

                <p>
                    この操作は取り消せません。
                </p>

            </div>


            <form
                class="favorite-form"
                action="/delete"
                method="POST"
            >

                <input
                    type="hidden"
                    name="id"
                    value="{{ wiki_id }}"
                >

                <div class="form-actions">

                    <button type="submit" class="btn">
                        削除する
                    </button>

                    <a href="/favorites" class="btn secondary-btn">
                        キャンセル
                    </a>

                </div>

            </form>

        </section>

    </main>


    <!-- =========================
         ページ下部
    ========================== -->
    <footer class="site-footer">

        <p>
            GAME WIKI
        </p>

    </footer>

</body>

</html>
