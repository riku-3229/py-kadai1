<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>攻略一覧 | GAME WIKI</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <!-- =========================
         ページ上部
    ========================== -->
    <header class="site-header">

        <div class="header-container">

            <a href="/" class="site-title">
                GAME WIKI
            </a>

            <nav class="site-nav" aria-label="メインナビゲーション">
                <a href="/">トップ</a>
                <a href="/favorites" aria-current="page">攻略一覧</a>
                <a href="/search">検索</a>
            </nav>

        </div>

    </header>


    <!-- =========================
         メインコンテンツ
    ========================== -->
    <main class="main-container">

        <section class="favorites-section">

            <div class="section-heading">

                <div>
                    <h1>攻略一覧</h1>

                    <p>
                        登録した敵、武器、アイテムなどの攻略情報を確認できます。
                    </p>
                </div>

                <div class="heading-actions">

                    <a href="/add" class="btn">
                        攻略情報を追加
                    </a>

                    <a href="/search" class="btn secondary-btn">
                        検索
                    </a>

                </div>

            </div>


            <p class="result-count">
                表示件数：{{ result_count }}件
            </p>


            <!-- 攻略情報一覧 -->
            <div class="table-container">

                <table class="favorites-table">

                    <thead>
                        <tr>
                            <th scope="col">画像</th>
                            <th scope="col">ゲーム</th>
                            <th scope="col">名前</th>
                            <th scope="col">カテゴリ</th>
                            <th scope="col">攻略メモ</th>
                            <th scope="col">操作</th>
                        </tr>
                    </thead>

                    <tbody>
                        {{ favorites_rows }}
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- =========================
         ページ下部
    ========================== -->
    <footer class="site-footer">

        <p>
            GAME WIKI
        </p>

    </footer>

</body>

</html>
