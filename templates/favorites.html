<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>お気に入り一覧 | 推し活ダッシュボード</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <!-- =========================
         ページ上部
    ========================== -->
    <header class="site-header">

        <div class="header-container">

            <a href="/" class="site-title">
                推し活ダッシュボード
            </a>

            <nav class="site-nav" aria-label="メインナビゲーション">
                <a href="/">トップ</a>
                <a href="/favorites" aria-current="page">お気に入り一覧</a>
            </nav>

        </div>

    </header>


    <!-- =========================
         メインコンテンツ
    ========================== -->
    <main class="main-container">

        <!-- =========================
             お気に入り一覧
        ========================== -->
        <section class="favorites-section">

            <div class="section-heading">

                <div>
                    <h1>お気に入り一覧</h1>

                    <p>
                        登録済みのタイトル、ジャンル、タグを確認できます。
                    </p>
                </div>

                <div class="heading-actions">
                    <a href="/add" class="btn">
                        お気に入りを追加
                    </a>

                    <a href="/search" class="btn secondary-btn">
                        詳細検索
                    </a>
                </div>

            </div>


            <!-- 絞り込み・並び替え -->
            <form
                class="filter-form"
                action="/favorites"
                method="GET"
            >

                <div class="form-group">

                    <label for="genre">
                        ジャンル
                    </label>

                    <select
                        id="genre"
                        name="genre"
                    >
                        {{ genre_options }}
                    </select>

                </div>


                <div class="form-group">

                    <label for="sort">
                        並び順
                    </label>

                    <select
                        id="sort"
                        name="sort"
                    >
                        {{ sort_options }}
                    </select>

                </div>


                <div class="form-actions">

                    <button type="submit" class="btn">
                        表示する
                    </button>

                    <a href="/favorites" class="btn secondary-btn">
                        条件を解除
                    </a>

                </div>

            </form>


            <p class="result-count">
                表示件数：{{ result_count }}件
            </p>


            <!-- お気に入り一覧表 -->
            <div class="table-container">

                <table class="favorites-table">

                    <thead>
                        <tr>
                            <th scope="col">タイトル</th>
                            <th scope="col">ジャンル</th>
                            <th scope="col">タグ</th>
                            <th scope="col">操作</th>
                        </tr>
                    </thead>

                    <tbody>
                        {{ favorites_rows }}
                    </tbody>

                </table>

            </div>




        </section>

    </main>


    <!-- =========================
         ページ下部
    ========================== -->
    <footer class="site-footer">

        <p>
            推し活ダッシュボード
        </p>

    </footer>

</body>

</html>
