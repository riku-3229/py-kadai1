<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GAME WIKI</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <header class="site-header">

        <div class="header-container">

            <a href="/" class="site-title">
                GAME WIKI
            </a>

            <nav class="site-nav" aria-label="メインナビゲーション">
                <a href="/" aria-current="page">トップ</a>
                <a href="/favorites">攻略一覧</a>
                <a href="/add">攻略情報追加</a>
                <a href="/search">検索</a>
            </nav>

        </div>

    </header>


    <main class="main-container">

        <section class="favorites-guide">

            <details open>

                <summary>
                    GAME WIKIについて
                </summary>

                <div class="favorites-guide-content">

                    <p>
                        プレイしたゲームの敵、武器、アイテムなどの情報を
                        自分用にまとめる攻略Wikiです。
                    </p>

                    <p>
                        攻略情報の追加・検索・削除ができます。
                    </p>

                    <a href="/favorites" class="btn">
                        攻略一覧を見る
                    </a>

                </div>

            </details>

        </section>


        <section class="news-section">

            <div class="section-heading">

                <div>
                    <h2>ゲームニュース</h2>

                    <p>
                        登録されているゲーム関連ニュースを表示しています。
                    </p>
                </div>

                <p class="news-updated-at">
                    更新日時：{{ news_updated_at }}
                </p>

            </div>

            <ul class="news-list">
                {{ news_items }}
            </ul>

        </section>

    </main>


    <footer class="site-footer">
        <p>GAME WIKI</p>
    </footer>

</body>

</html>
