<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>武器検索 | GAME WIKI</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <!-- =========================
         ページ上部
    ========================== -->
    <header class="site-header">

        <div class="header-container">

            <a href="/" class="site-title">
                GAME WIKI
            </a>

            <nav class="site-nav" aria-label="メインナビゲーション">
                <a href="/">トップ</a>
                <a href="/favorites">武器一覧</a>
                <a href="/search" aria-current="page">検索</a>
            </nav>

        </div>

    </header>


    <!-- =========================
         メインコンテンツ
    ========================== -->
    <main class="main-container">

        <section class="search-section">

            <div class="section-heading">

                <div>
                    <h1>武器検索</h1>

                    <p>
                        武器名から登録した武器情報を検索できます。
                    </p>
                </div>

            </div>


            <!-- 検索フォーム -->
            <form
                class="favorite-form"
                action="/search"
                method="POST"
            >

                <div class="form-group">

                    <label for="keyword">
                        武器名
                    </label>

                    <input
                        type="text"
                        id="keyword"
                        name="keyword"
                        value="{{ keyword }}"
                        placeholder="例：クレイモア"
                        required
                    >

                </div>


                <div class="form-actions">

                    <button type="submit" class="btn">
                        検索する
                    </button>

                    <a href="/search" class="btn secondary-btn">
                        条件を解除
                    </a>

                </div>

            </form>


            <!-- 検索条件・件数 -->
            <div class="search-summary">

                <p>
                    {{ search_message }}
                </p>

                <p class="result-count">
                    検索結果：{{ result_count }}件
                </p>

            </div>


            <!-- 検索結果 -->
            <div class="table-container">

                <table class="favorites-table">

                    <thead>
                        <tr>
                            <th scope="col">武器名</th>
                            <th scope="col">武器種</th>
                            <th scope="col">攻撃属性</th>
                            <th scope="col">入手場所</th>
                            <th scope="col">特徴メモ</th>
                            <th scope="col">操作</th>
                        </tr>
                    </thead>

                    <tbody>
                        {{ search_results }}
                    </tbody>

                </table>

            </div>


            <div class="page-navigation">

                <a href="/favorites" class="text-link">
                    武器一覧へ戻る
                </a>

            </div>

        </section>

    </main>


    <!-- =========================
         ページ下部
    ========================== -->
    <footer class="site-footer">

        <p>
            GAME WIKI
        </p>

    </footer>

</body>

</html>
